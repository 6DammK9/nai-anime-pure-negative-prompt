services:
  vllm-openai:
    #image: vllm/vllm-openai:latest-cu130
    image: vllm/vllm-openai:v0.14.1-cu130
    ports:
      - "8002:8002"
    volumes:
      - ./cache:/root/.cache
    env_file:
      - .env
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "--model"
      - ${VLLM_HF_MODEL}
      - "--host"
      - ${VLLM_HOST}
      - "--port"
      - ${VLLM_PORT}
      - "--gpu-memory-utilization"
      - ${VLLM_VRAM_LIMIT}
      - "--max-model-len"
      - ${VLLM_MAX_MODEL_LEN}
      - "--max-num-seqs"
      - ${VLLM_MAX_NUM_SEQS}
      #- "--enable-reasoning"
      - "--reasoning-parser"
      - ${VLLM_REASONING_PARSER}
      - "--tokenizer"
      - ${VLLM_TOKENIZER}
      - "--quantization"
      - ${VLLM_QUANTIZATION}
      - "--served-model-name"
      - ${VLLM_SERVE_MODEL_NAME}
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - ${VLLM_TOOL_CALL_PARSER}    
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s