global:
  router:
    config_source: file
    strategy: priority
    auto_model_name: MoM
    include_config_models_in_list: true
    clear_route_cache: false
    streamed_body:
      enabled: true
      max_bytes: 1048576
      timeout_sec: 15
    skip_processing:
      enabled: false
    model_selection:
      method: hybrid
      enabled: true
      elo:
        initial_rating: 1200
        k_factor: 32
        category_weighted: true
        decay_factor: 0.97
        min_comparisons: 5
        cost_scaling_factor: 0.2
        storage_path: state/elo-global.json
        auto_save_interval: 5m
      router_dc:
        temperature: 0.2
        dimension_size: 384
        min_similarity: 0.7
        use_query_contrastive: true
        use_model_contrastive: true
        require_descriptions: true
        use_capabilities: true
      automix:
        verification_threshold: 0.8
        max_escalations: 2
        cost_aware_routing: true
        cost_quality_tradeoff: 0.4
        discount_factor: 0.9
        use_logprob_verification: true
      hybrid:
        elo_weight: 0.4
        router_dc_weight: 0.35
        automix_weight: 0.25
        cost_weight: 0.1
        quality_gap_threshold: 0.08
        normalize_scores: true
      momentum:
        enabled: false
        attack: 0.7
        release: 0.3
        threshold: 0.6
      # hf download abdallah1008/semantic-router-ml-models --local-dir models/model-selection
      ml:
        models_path: models/model-selection
        embedding_dim: 384
        knn:
          k: 5
          # pretrained_path: models/model-selection/knn.bin
          pretrained_path: models/model-selection/knn_model.json
        kmeans:
          num_clusters: 8
          efficiency_weight: 0.35
          # pretrained_path: models/model-selection/kmeans.bin
          pretrained_path: models/model-selection/kmeans_model.json
        svm:
          kernel: rbf
          gamma: 0.12
          # pretrained_path: models/model-selection/svm.bin
          pretrained_path: models/model-selection/svm_model.json
        mlp:
          device: cpu
          # pretrained_path: models/model-selection/mlp.pt
          pretrained_path: models/model-selection/mlp_model.json
      lookup_tables:
        enabled: false
        storage_path: ''
        auto_save_interval: ''
        populate_from_replay: false
        populate_interval: ''
        quality_gaps:
          - task_family: coding
            current_model: small
            candidate_model: large
            value: 0.15
        handoff_penalties:
          - from_model: small
            to_model: large
            value: 0.02
        remaining_turn_priors:
          - intent_or_domain: support
            value: 3.5
  services:
    api:
      batch_classification:
        max_batch_size: 100
        concurrency_threshold: 5
        max_concurrency: 8
        metrics:
          sample_rate: 1
          batch_size_ranges:
            - min: 1
              max: 4
              label: tiny
            - min: 5
              max: 16
              label: standard
          duration_buckets:
            - 0.01
            - 0.05
            - 0.1
            - 0.5
            - 1
          size_buckets:
            - 128
            - 512
            - 2048
            - 8192
          enabled: false
          detailed_goroutine_tracking: true
          high_resolution_timing: true
    response_api:
      enabled: true
      store_backend: redis
      ttl_seconds: 86400
      max_responses: 1000
      redis:
        address: '192.168.1.116:6379'
        password: redis-secret
        db: 0
        key_prefix: 'vsr:responses:'
    observability:
      tracing:
        enabled: true
        provider: opentelemetry
        exporter:
          type: otlp
          endpoint: '192.168.1.115:4317'
          insecure: true
        sampling:
          type: always_on
          rate: 1
        resource:
          service_name: vllm-sr
          service_version: v0.3.0
          deployment_environment: development
      metrics:
        enabled: true
        windowed_metrics:
          enabled: false
          model_metrics: false
          queue_depth_estimation: false
    #Chat UI will exit
    authz: {}
    # src/semantic-router/pkg/headers/headers.go
    # authz:
    #     fail_open: true
    #     identity:
    #         #user_id_header: x-user-id
    #         #user_groups_header: x-user-groups
    #         user_id_header: x-authz-user-id
    #         user_groups_header: x-authz-user-groups
    #     providers:
    #         - type: header-injection
    #           headers:
    #             openai: x-user-openai-key
    #             anthropic: x-user-anthropic-key
    #             azure-openai: x-user-azure-openai-key
    #             minimax: x-user-minimax-key
    #         - type: static-config
    ratelimit: {}
    startup_status:
      store_backend: redis
      redis:
        address: '192.168.1.116:6379'
        db: 0
        password: redis-secret
    router_replay:
      # Huge lag (60 sec)
      # enabled: true
      # store_backend: milvus
      enabled: false
      store_backend: memory
      ttl_seconds: 2592000
      async_writes: true
      redis:
        address: '192.168.1.116:6379'
        db: 0
        password: redis-secret
        use_tls: false
        tls_skip_verify: false
        max_retries: 3
        pool_size: 20
        key_prefix: 'vsr:replay:'
      postgres:
        host: 192.168.1.117
        port: 5432
        database: vsr
        user: router
        password: router-secret
        ssl_mode: disable
        max_open_conns: 20
        max_idle_conns: 10
        conn_max_lifetime: 300
        table_name: router_replay
      milvus:
        address: '192.168.1.118:19530'
        username: root
        password: milvus-secret
        collection_name: router_replay
        consistency_level: Bounded
        shard_num: 2
  stores:
    semantic_cache:
      enabled: true
      backend_type: milvus
      similarity_threshold: 0.86
      max_entries: 50000
      ttl_seconds: 7200
      eviction_policy: fifo
      # embedding_model: bert, mmbert, qwen3, gemma
      embedding_model: qwen3
      # type RedisConfig struct
      redis:
        connection:
          host: 192.168.1.116
          port: 6379
          database: 0
          password: ''
          timeout: 5
          tls:
            enabled: false
            cert_file: certs/redis.crt
            key_file: certs/redis.key
            ca_file: certs/ca.crt
        index:
          name: semantic_cache_idx
          prefix: 'vsr:cache:'
          vector_field:
            name: embedding
            dimension: 1024
            metric_type: COSINE
          index_type: HNSW
          params:
            M: 16
            efConstruction: 200
        search:
          topk: 10
        development:
          drop_index_on_startup: false
          auto_create_index: true
          verbose_errors: true
        logging:
          level: info
          enable_query_log: true
          enable_metrics: true
      # type MilvusConfig struct
      milvus:
        connection:
          host: 192.168.1.118
          port: 19530
          database: default
          timeout: 30
          auth:
            enabled: false
            username: root
            password: milvus-secret
          tls:
            enabled: false
            cert_file: certs/milvus.crt
            key_file: certs/milvus.key
            ca_file: certs/ca.crt
        collection:
          name: semantic_cache
          description: Semantic cache vectors.
          vector_field:
            name: embedding
            dimension: 1024
            metric_type: COSINE
          index:
            type: HNSW
            params:
              M: 16
              efConstruction: 200
        search:
          params:
            ef: 64
          topk: 10
          consistency_level: Bounded
        performance:
          connection_pool:
            max_connections: 20
            max_idle_connections: 10
            acquire_timeout: 10
          batch:
            insert_batch_size: 128
            timeout: 30
        data_management:
          ttl:
            enabled: true
            timestamp_field: created_at
            cleanup_interval: 3600
          compaction:
            enabled: true
            interval: 86400
        logging:
          level: info
          enable_query_log: true
          enable_metrics: true
        development:
          drop_collection_on_startup: false
          auto_create_collection: true
          verbose_errors: true
    memory:
      # Sequence bug occured. Never load within retries
      # enabled: true
      enabled: false
      auto_store: false
      disabled_routes: []
      disabled_models: []
      milvus:
        address: '192.168.1.118:19530'
        collection: agentic_memory
        dimension: 1024
        num_partitions: 32
      # wrapWithRedisCache
      redis_cache:
        enabled: true
        address: '192.168.1.116:6379'
        ttl_seconds: 300
        db: 0
        key_prefix: 'memory_cache:'
        password: ''
      # embedding_model: mmbert, qwen3, gemma
      embedding_model: qwen3
      extraction_batch_size: 16
      default_retrieval_limit: 10
      default_similarity_threshold: 0.74
      hybrid_search: true
      hybrid_mode: rerank
      adaptive_threshold: true
      quality_scoring:
        initial_strength_days: 30
        prune_threshold: 0.15
        max_memories_per_user: 200
      reflection:
        enabled: true
        algorithm: recency_semantic
        max_inject_tokens: 512
        recency_decay_days: 14
        dedup_threshold: 0.9
        block_patterns:
          - api key
          - password
    vector_store:
      enabled: true
      backend_type: milvus
      file_storage_dir: /var/lib/vsr/data
      max_file_size_mb: 100
      # embedding_model: mmbert, qwen3, gemma
      embedding_model: qwen3
      embedding_dimension: 1024
      ingestion_workers: 4
      supported_formats:
        - .txt
        - .md
        - .json
        - .csv
        - .html
        - .pdf
      milvus:
        connection:
          host: 192.168.1.118
          port: 19530
          database: default
          timeout: 30
          auth:
            enabled: false
            username: root
            password: milvus-secret
          tls:
            enabled: false
            cert_file: certs/milvus.crt
            key_file: certs/milvus.key
            ca_file: certs/ca.crt
        collection:
          name: vector_store
          description: Uploaded document embeddings.
          vector_field:
            name: embedding
            dimension: 1024
            metric_type: COSINE
          index:
            type: HNSW
            params:
              M: 16
              efConstruction: 200
        search:
          params:
            ef: 64
          topk: 10
          consistency_level: Strong
        performance:
          connection_pool:
            max_connections: 20
            max_idle_connections: 10
            acquire_timeout: 10
          batch:
            insert_batch_size: 64
            timeout: 30
        data_management:
          ttl:
            enabled: true
            timestamp_field: created_at
            cleanup_interval: 3600
          compaction:
            enabled: true
            interval: 86400
        logging:
          level: info
          enable_query_log: true
          enable_metrics: true
        development:
          drop_collection_on_startup: false
          auto_create_collection: true
          verbose_errors: true
      memory:
        max_entries_per_store: 5000
      metadata_store: postgres
      metadata_postgres:
        host: 192.168.1.117
        port: 5432
        database: vsr
        user: vllmuser
        password: Etag1234
        ssl_mode: disable
        max_open_conns: 25
        max_idle_conns: 5
        conn_max_lifetime: 300
        table_name: vector_store_registry
  integrations:
    tools:
      enabled: true
      top_k: 5
      similarity_threshold: 0.35
      # https://github.com/vllm-project/semantic-router/blob/main/deploy/kubernetes/observability/dashboard/tools_db.json
      tools_db_path: config/tools_db.json
      fallback_to_empty: true
      advanced_filtering:
        enabled: true
        candidate_pool_size: 50
        min_lexical_overlap: 1
        min_combined_score: 0.42
        weights:
          embed: 0.5
          lexical: 0.2
          tag: 0.1
          name: 0.1
          category: 0.1
        use_category_filter: true
        category_confidence_threshold: 0.7
        allow_tools:
          - docs.search
          - tickets.lookup
        block_tools:
          - admin.delete
    looper:
      endpoint: 'http://vllm-sr-envoy-container:8899/v1/chat/completions'
      model_endpoints:
        vllm/qwen3: 'http://192.168.1.113:8002/v1/chat/completions'
        vllm/qwen3-coder-flash: 'http://192.168.1.112:8001/v1/chat/completions'
      grpc_max_msg_size_mb: 16
      timeout_seconds: 120
      retry_count: 2
      headers:
        X-Trace-Source: looper
  model_catalog:
    embeddings:
      semantic:
        qwen3_model_path: models/mom-embedding-pro
        # Gated and need to sign external consent form: google/embeddinggemma-300m
        # Use finetuned non gated model instead
        # hf download vectorranger/embeddinggemma-300m-medical-300k --local-dir models/mom-embedding-flash
        gemma_model_path: models/mom-embedding-flash
        mmbert_model_path: models/mom-embedding-ultra
        #Broken: llm-semantic-router/multi-modal-embed-small
        #multimodal_model_path: models/mom-embedding-multimodal
        multimodal_model_path: ''
        bert_model_path: models/mom-embedding-light
        use_cpu: true
        embedding_config:
          # backend: candle
          model_type: qwen3
          # model_type: mmbert
          preload_embeddings: true
          target_dimension: 1024
          target_layer: 22
          enable_soft_matching: true
          top_k: 1
          min_score_threshold: 0.45
          prototype_scoring:
            enabled: true
            cluster_similarity_threshold: 0.9
            max_prototypes: 8
            best_weight: 0.75
            top_m: 2
            margin_threshold: 0
    system:
      prompt_guard: models/mmbert32k-jailbreak-detector-merged
      domain_classifier: models/mmbert32k-intent-classifier-merged
      pii_classifier: models/mmbert32k-pii-detector-merged
      fact_check_classifier: models/mmbert32k-factcheck-classifier-merged
      hallucination_detector: models/mom-halugate-detector
      hallucination_explainer: models/mom-halugate-explainer
      feedback_detector: models/mmbert32k-feedback-detector-merged
    kbs:
      - name: privacy_kb
        source:
          path: knowledge_bases/privacy/
          manifest: labels.json
        threshold: 0.55
        prototype_scoring:
          enabled: true
          cluster_similarity_threshold: 0.9
          max_prototypes: 8
          best_weight: 0.75
          top_m: 2
          margin_threshold: 0
        label_thresholds:
          prompt_injection: 0.7
        groups:
          frontier_reasoning:
            - architecture_analysis
            - root_cause_analysis
            - multi_step_tradeoffs
          local_standard:
            - generic_coding
            - simple_task
            - general_knowledge
          privacy_policy:
            - proprietary_code
            - internal_document
            - pii
            - business_strategy
            - trade_secret_ip
            - operational_infrastructure
            - locality_directive
            - customer_data
          private:
            - prompt_injection
            - credential_exfiltration
            - jailbreak_role
            - system_prompt_extraction
            - proprietary_code
            - internal_document
            - pii
            - business_strategy
            - trade_secret_ip
            - operational_infrastructure
            - locality_directive
            - customer_data
          public:
            - architecture_analysis
            - root_cause_analysis
            - multi_step_tradeoffs
            - generic_coding
            - simple_task
            - general_knowledge
          security_containment:
            - prompt_injection
            - credential_exfiltration
            - jailbreak_role
            - system_prompt_extraction
        metrics:
          - name: private_vs_public
            type: group_margin
            positive_group: private
            negative_group: public
      - name: mmlu_kb
        source:
          path: knowledge_bases/mmlu/
          manifest: labels.json
        threshold: 0.25
        prototype_scoring:
          enabled: true
          cluster_similarity_threshold: 0.9
          max_prototypes: 8
          best_weight: 0.75
          top_m: 2
          margin_threshold: 0
        groups:
          escalate:
            - biology
            - business
            - computer science
            - economics
            - history
            - math
            - other
            - philosophy
            - psychology
          keep:
            - chemistry
            - engineering
            - health
            - law
            - physics
        metrics:
          - name: escalate_vs_keep
            type: group_margin
            positive_group: escalate
            negative_group: keep
    modules:
      prompt_compression:
        enabled: true
        max_tokens: 4096
        min_length: 512
        skip_signals:
          - jailbreak
          - pii
        textrank_weight: 0.4
        position_weight: 0.2
        tfidf_weight: 0.3
        position_depth: 0.1
      prompt_guard:
        enabled: true
        model_ref: prompt_guard
        model_id: models/mmbert32k-jailbreak-detector-merged
        threshold: 0.7
        use_cpu: true
        use_modernbert: false
        use_mmbert_32k: true
        jailbreak_mapping_path: models/mmbert32k-jailbreak-detector-merged/jailbreak_type_mapping.json
        use_vllm: false
      classifier:
        domain:
          model_ref: domain_classifier
          model_id: models/mmbert32k-intent-classifier-merged
          threshold: 0.5
          use_cpu: true
          use_modernbert: false
          use_mmbert_32k: true
          category_mapping_path: models/mmbert32k-intent-classifier-merged/category_mapping.json
          fallback_category: other
        mcp:
          enabled: true
          transport_type: stdio
          command: python
          args:
            - '-m'
            - mcp_classifier
          env:
            MCP_MODE: local
          url: 'http://localhost:9010'
          tool_name: classify
          threshold: 0.6
          timeout_seconds: 15
        pii:
          model_ref: pii_classifier
          model_id: models/mmbert32k-pii-detector-merged
          threshold: 0.9
          use_cpu: true
          use_mmbert_32k: true
          pii_mapping_path: models/mmbert32k-pii-detector-merged/pii_type_mapping.json
        preference:
          use_contrastive: true
          # embedding_model: mmbert, qwen3, gemma, multimodal
          embedding_model: qwen3
          prototype_scoring:
            enabled: true
            cluster_similarity_threshold: 0.9
            max_prototypes: 8
            best_weight: 0.75
            top_m: 2
            margin_threshold: 0
      complexity:
        prototype_scoring:
          enabled: true
          cluster_similarity_threshold: 0.9
          max_prototypes: 6
          best_weight: 0.75
          top_m: 2
          margin_threshold: 0
      hallucination_mitigation:
        enabled: true
        on_hallucination_detected: annotate
        fact_check:
          model_ref: fact_check_classifier
          model_id: models/mmbert32k-factcheck-classifier-merged
          threshold: 0.65
          use_cpu: true
          use_mmbert_32k: true
        detector:
          model_ref: hallucination_detector
          model_id: models/mom-halugate-detector
          threshold: 0.82
          use_cpu: true
          min_span_length: 2
          min_span_confidence: 0.6
          context_window_size: 50
          enable_nli_filtering: true
          nli_entailment_threshold: 0.75
        explainer:
          model_ref: hallucination_explainer
          model_id: models/mom-halugate-explainer
          threshold: 0.9
          use_cpu: true
      feedback_detector:
        enabled: true
        model_ref: feedback_detector
        model_id: models/mmbert32k-feedback-detector-merged
        threshold: 0.7
        use_cpu: true
        use_modernbert: false
        use_mmbert_32k: true
        feedback_mapping_path: models/mmbert32k-feedback-detector-merged/feedback_mapping.json
      modality_detector:
        enabled: true
        prompt_prefixes:
          - generate an image of
          - draw
          - create a picture of
        method: hybrid
        classifier:
          model_path: models/mmbert32k-modality-router-merged
          use_cpu: true
        keywords:
          - image
          - picture
          - illustration
        both_keywords:
          - explain and illustrate
          - describe with an image
        confidence_threshold: 0.7
        lower_threshold_ratio: 0.7
