version: v0.3
listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 300s
providers:
  defaults:
    default_model: qwen3
    default_reasoning_effort: medium
    reasoning_families:
      qwen3:
        type: chat_template_kwargs
        parameter: enable_thinking
      gpt:
        type: reasoning_effort
        parameter: reasoning.effort
  models:
    - name: vllm/qwen3
      provider_model_id: qwen3
      backend_refs:
        - name: vllm
          endpoint: '192.168.1.113:8002'
          protocol: http
          weight: 1
      pricing:
        currency: USD
      reasoning_family: qwen3
      api_format: openai
    - name: vllm/qwen3-coder-flash
      # provider_model_id: Qwen/Qwen3.5-9B
      provider_model_id: NVFP4/Qwen3-Coder-30B-A3B-Instruct-FP4
      backend_refs:
        - name: vllm
          # endpoint: 192.168.1.113:8002
          endpoint: '192.168.1.112:8010'
          protocol: http
          weight: 1
      pricing:
        currency: USD
      reasoning_family: qwen3
      api_format: openai
    - name: qwen3-nano
      provider_model_id: Qwen/Qwen3-0.6B
      backend_refs:
        - name: litellm
          endpoint: '192.168.1.114:4000'
          protocol: http
          weight: 1
          api_key: sk-xxxxxxxxxxxxxxxxxxxxxx
      pricing:
        currency: USD
      reasoning_family: gpt
      api_format: openai
    - name: qwen3
      # provider_model_id: Qwen3.5-9B-FP8
      # provider_model_id: Qwen3-Coder-30B-A3B-Instruct-FP4
      # provider_model_id: Qwen3-Coder
      provider_model_id: Qwen/Qwen3-0.6B
      backend_refs:
        - name: litellm
          endpoint: '192.168.1.114:4000'
          protocol: http
          weight: 1
          api_key: sk-xxxxxxxxxxxxxxxxxxxxxx
      pricing:
        currency: USD
      reasoning_family: gpt
      api_format: openai
    - name: qwen3-coder-flash
      # provider_model_id: Qwen3.5-9B-FP8
      # provider_model_id: Qwen3-Coder-30B-A3B-Instruct-FP4
      provider_model_id: Qwen3-Coder
      backend_refs:
        - name: litellm
          endpoint: '192.168.1.114:4000'
          protocol: http
          weight: 1
          api_key: sk-xxxxxxxxxxxxxxxxxxxxxx
      pricing:
        currency: USD
      reasoning_family: gpt
      api_format: openai
routing:
  modelCards:
    - name: qwen3-coder-flash
      param_size: 30B
      context_window_size: 65536
      description: Higher-quality text model for complex and verified requests.
      capabilities:
        - chat
        - reasoning
        - long-context
      quality_score: 0.96
      modality: text
      tags:
        - premium
        - analysis
    - name: qwen3
      param_size: 0.6B
      context_window_size: 87996
      description: General-purpose text model for the default routing tier.
      capabilities:
        - chat
        - reasoning
        - tools
      quality_score: 0.83
      modality: text
      tags:
        - default
        - fast
    - name: qwen3-nano
      param_size: 0.6B
      context_window_size: 87996
      description: General-purpose text model for the default routing tier.
      capabilities:
        - chat
        - reasoning
        - tools
      quality_score: 0.83
      modality: text
      tags:
        - default
        - fast
    - name: vllm/qwen3-coder-flash
      param_size: 9B
      context_window_size: 65536
      description: Higher-quality text model for complex and verified requests.
      capabilities:
        - chat
        - reasoning
        - long-context
      quality_score: 0.96
      modality: text
      tags:
        - premium
        - analysis
    - name: vllm/qwen3
      param_size: 0.6B
      context_window_size: 1792
      description: General-purpose text model for the default routing tier.
      capabilities:
        - chat
        - reasoning
        - tools
      quality_score: 0.83
      modality: text
      tags:
        - default
        - fast
  signals:
    keywords:
      - name: keyword-9b
        operator: OR
        keywords:
          - 9b
          - large
          - big
        case_sensitive: false
      - name: keyword-0.6b
        operator: OR
        keywords:
          - 0.6b
          - small
          - nano
        case_sensitive: false
    # Official samples
    #keywords:
      - name: code_keywords
        operator: OR
        method: bm25
        keywords:
          - code
          - function
          - debug
          - algorithm
          - refactor
        case_sensitive: false
        bm25_threshold: 0.1
      - name: urgent_keywords
        operator: OR
        method: ngram
        keywords:
          - urgent
          - immediate
          - asap
          - emergency
        case_sensitive: false
        ngram_threshold: 0.4
        ngram_arity: 3
    # unsupported keyword rule method
    # - name: fuzzy_sensitive_keywords
    #   operator: OR
    #   method: fuzzy
    #   keywords: ["social security", "credit card", "password", "api key"]
    #   case_sensitive: false
    #   fuzzy_match: true
    #   fuzzy_threshold: 82

    embeddings:
      - name: technical_support
        threshold: 0.75
        aggregation_method: max
        candidates:
          - how to configure the system
          - installation guide
          - troubleshooting steps
          - error message explanation
      - name: account_management
        threshold: 0.72
        aggregation_method: any
        candidates:
          - password reset
          - account settings
          - billing information
          - subscription management
    domains:
      - name: business
        description: Business and management related queries.
        mmlu_categories:
          - business
        model_scores:
          - model: qwen3
            score: 0.96
            use_reasoning: true
      - name: law
        description: Legal questions and policy topics.
        mmlu_categories:
          - law
      - name: psychology
        description: Psychology and mental-health oriented prompts.
        mmlu_categories:
          - psychology
      - name: health
        description: Health and medical information requests.
        mmlu_categories:
          - health
      - name: computer_science
        description: Computer science and engineering prompts.
        mmlu_categories:
          - computer science
      - name: other
        description: General fallback traffic.
        mmlu_categories:
          - other
    fact_check:
      - name: needs_fact_check
        description: Prompts with factual claims that should be verified.
      - name: no_fact_check_needed
        description: Creative prompts that do not need factual verification.
    user_feedbacks:
      - name: wrong_answer
        description: The user indicates the previous answer was incorrect.
      - name: need_clarification
        description: The user asks for a clearer or more detailed answer.
    reasks:
      - name: likely_dissatisfied
        description: >-
          The current user turn closely repeats the immediately previous user
          turn.
        threshold: 0.8
        lookback_turns: 1
      - name: persistently_dissatisfied
        description: The current user turn repeats the last two user turns in a row.
        threshold: 0.8
        lookback_turns: 2
    preferences:
      - name: terse_answers
        description: 'Users who prefer short, direct responses.'
        examples:
          - keep it concise
          - bullet points only
          - answer in one paragraph
        threshold: 0.7
    language:
      - name: zh
        description: Chinese-language requests.
      - name: es
        description: Spanish-language requests.
    context:
      - name: long_context
        min_tokens: 32K
        max_tokens: 256K
        description: Requests that need larger effective context windows.
    structure:
      - name: many_questions
        description: Prompts that contain many explicit questions.
        feature:
          type: count
          source:
            type: regex
            pattern: '[?？]'
        predicate:
          gte: 4
      - name: at_most_one_question
        description: Prompts with one or fewer explicit questions.
        feature:
          type: count
          source:
            type: regex
            pattern: '[?？]'
        predicate:
          lte: 1
      - name: numbered_steps
        description: Prompts that contain numbered list items such as "1. ..."
        feature:
          type: exists
          source:
            type: regex
            pattern: (?m)^\s*\d+\.\s+
      - name: first_then_flow
        description: Prompts that express an ordered workflow.
        feature:
          type: sequence
          source:
            type: sequence
            case_sensitive: false
            sequences:
              - - first
                - then
              - - first
                - next
                - finally
              - - 首先
                - 然后
              - - 先
                - 再
      - name: constraint_dense
        description: >-
          Prompts with dense explicit constraints relative to multilingual text
          units.
        feature:
          type: density
          source:
            type: keyword_set
            case_sensitive: false
            keywords:
              - under
              - at most
              - at least
              - within
              - no more than
              - 不超过
              - 至少
              - 最多
        predicate:
          gt: 0.08
      - name: format_directive_dense
        description: >-
          Prompts with dense output-format directives relative to multilingual
          text units.
        feature:
          type: density
          source:
            type: keyword_set
            keywords:
              - table
              - bullet
              - json
              - markdown
              - 表格
              - 列表
              - JSON
        predicate:
          gt: 0.08
      - name: low_question_density
        description: >-
          Prompts with very low question density relative to multilingual text
          units.
        feature:
          type: density
          source:
            type: regex
            pattern: '[?？]'
        predicate:
          lt: 0.05
    complexity:
      - name: needs_reasoning
        threshold: 0.75
        description: Escalate multi-step reasoning or synthesis-heavy prompts.
        hard:
          candidates:
            - solve this step by step
            - compare multiple tradeoffs
            - analyze the root cause
          # complexity image_candidates requires embedding_models.multimodal_model_path to be set
          # image_candidates:
          #   - generate a detailed architecture diagram
        easy:
          candidates:
            - answer briefly
            - quick summary
            - simple rewrite
          # complexity image_candidates requires embedding_models.multimodal_model_path to be set
          # image_candidates:
          #   - make a simple icon
        composer:
          operator: OR
          conditions:
            - type: context
              name: long_context
            - type: domain
              name: computer_science
    modality:
      - name: AR
        description: Text-only autoregressive requests.
      - name: DIFFUSION
        description: Image-generation requests.
      - name: BOTH
        description: Requests that need both text and image generation.
    jailbreak:
      - name: prompt_injection
        method: hybrid
        threshold: 0.8
        include_history: true
        description: Detect common prompt-injection or jailbreak attempts.
        jailbreak_patterns:
          - ignore previous instructions
          - reveal the hidden prompt
          - jailbreak mode
        benign_patterns:
          - explain the policy
          - summarize the safety rules
    pii:
      - name: restricted_pii
        threshold: 0.85
        include_history: true
        pii_types_allowed:
          - EMAIL_ADDRESS
        description: Sensitive prompts where only low-risk identifiers may pass through.
    kb:
      - name: privacy_policy
        kb: privacy_kb
        target:
          kind: group
          value: privacy_policy
        match: best
      - name: security_containment
        kb: privacy_kb
        target:
          kind: group
          value: security_containment
        match: best
      - name: frontier_reasoning
        kb: privacy_kb
        target:
          kind: group
          value: frontier_reasoning
        match: best
      - name: local_standard
        kb: privacy_kb
        target:
          kind: group
          value: local_standard
        match: best
    conversation:
      - name: multi_turn_user
        description: At least two user messages.
        feature:
          type: count
          source:
            type: message
            role: user
        predicate:
          gte: 2
      - name: has_tools
        description: Request defines at least one tool.
        feature:
          type: count
          source:
            type: tool_definition
        predicate:
          gte: 1
      - name: has_developer_msg
        description: Request contains a developer message.
        feature:
          type: exists
          source:
            type: message
            role: developer
      - name: heavy_non_user
        description: Non-user messages exceed threshold.
        feature:
          type: count
          source:
            type: message
            role: non_user
        predicate:
          gt: 5
          lte: 99
    #session_metrics:
    #  - name: session_cost_pressure
    #    kind: state
    #    state: session_routing.cumulative_cost_usd
    #    normalize: minmax
    #    min: 0
    #    max: 10
    #  - name: handoff_penalty
    #    kind: lookup
    #    table: handoff_penalties
    #    key:
    #      - session_routing.current_model
    #      - session_routing.candidate_model
    event:
      - name: critical_payment_event
        description: Critical payment or transaction events that need incident-grade routing.
        event_types:
          - payment_failed
          - transaction_declined
        severities:
          - critical
          - high
        action_codes:
          - TXN_DECLINE
        temporal: true
  projections:
    partitions:
      - name: support_intents
        semantics: exclusive
        temperature: 0.3
        members:
          - technical_support
          - account_management
        default: technical_support
    scores:
      - name: request_difficulty
        method: weighted_sum
        inputs:
          - type: embedding
            name: technical_support
            weight: 0.18
            value_source: confidence
            match: 1
            miss: 0
          - type: embedding
            name: account_management
            weight: -0.08
            value_source: confidence
          - type: complexity
            name: 'needs_reasoning:medium'
            weight: 0.18
          - type: complexity
            name: 'needs_reasoning:hard'
            weight: 0.36
          - type: context
            name: long_context
            weight: 0.18
          - type: structure
            name: first_then_flow
            weight: 0.12
      - name: privacy_kb_bias
        method: weighted_sum
        inputs:
          - type: kb_metric
            kb: privacy_kb
            metric: private_vs_public
            weight: 1
            value_source: score
    mappings:
      - name: request_band
        source: request_difficulty
        method: threshold_bands
        calibration:
          method: sigmoid_distance
          slope: 10
        outputs:
          - name: support_fast
            lte: 0.2
          - name: support_balanced
            gt: 0.2
            lt: 0.45
          - name: support_escalated
            gte: 0.45
  #session_states:
  #  - name: session_routing
  #    fields:
  #      - name: turn_number
  #        type: int
  #      - name: current_model
  #        type: string
  #      - name: cumulative_cost_usd
  #        type: float
  #      - name: retry_count_ema
  #        type: float
  #      - name: quality_score_ema
  #        type: float
  #      - name: kv_cache_warm
  #        type: float
  #      - name: candidate_model
  #        type: string
  decisions:
    - name: default-route
      description: Generated during setup to route all requests to the default model.
      priority: 1
      rules:
        operator: AND
      modelRefs:
        - model: qwen3
          use_reasoning: true
    # 260518: Temporary swap to 30b model for ClawOS observation
    - name: determine-size-0.6b
      priority: 250
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: keyword-0.6b
      modelRefs:
        - model: qwen3
          use_reasoning: true
    - name: determine-size-9b
      priority: 250
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: keyword-9b
      modelRefs:
        - model: qwen3-coder-flash
          use_reasoning: true
  # Official samples
  # decisions:
    - name: static_business_route
      description: Static fallback for standard business traffic.
      priority: 200
      tier: 2
      rules:
        operator: AND
        conditions:
          - type: domain
            name: business
      modelRefs:
        - model: qwen3
          use_reasoning: false
          reasoning_description: 'Prefer fast, direct business answers.'
      candidateIterations:
        - variable: candidate
          source: models
          models:
            - model: qwen3
              # No such LoRA
              # lora_name: business-adapter
              weight: 1
              use_reasoning: false
              reasoning_description: Candidate iteration reference model for DSL authoring coverage.
              reasoning_effort: low
          outputs:
            - type: model
              value: candidate
      algorithm:
        type: static
      plugins:
        - type: system_prompt
          configuration:
            enabled: true
            mode: insert
            system_prompt: >-
              You are a senior business consultant. Give practical
              recommendations and clear tradeoffs.
        - type: semantic-cache
          configuration:
            enabled: true
            similarity_threshold: 0.82
            ttl_seconds: 7200
        - type: tools
          configuration:
            enabled: true
            mode: filtered
            semantic_selection: true
            allow_tools:
              - search_web
            block_tools:
              - exec_cmd
    - name: legal_confidence_route
      description: Confidence-routed legal and factual traffic.
      priority: 190
      rules:
        operator: OR
        conditions:
          - type: domain
            name: law
          - type: fact_check
            name: needs_fact_check
      modelRefs:
        - model: qwen3
          use_reasoning: true
          reasoning_effort: medium
          weight: 0.4
        - model: qwen3-coder-flash
          use_reasoning: true
          reasoning_description: Escalate when confidence is weak.
          reasoning_effort: high
          weight: 0.6
      algorithm:
        type: confidence
        on_error: fallback
        confidence:
          confidence_method: hybrid
          threshold: 0.72
          hybrid_weights:
            logprob_weight: 0.65
            margin_weight: 0.35
          on_error: skip
          escalation_order: small_to_large
          cost_quality_tradeoff: 0.45
          token_filter: alpha_numeric
      plugins:
        - type: hallucination
          configuration:
            enabled: true
            use_nli: true
            hallucination_action: annotate
            unverified_factual_action: warn
            include_hallucination_details: true
    - name: health_ratings_route
      description: Ratings-based route for health requests that need fact verification.
      priority: 180
      rules:
        operator: AND
        conditions:
          - type: domain
            name: health
          - type: fact_check
            name: needs_fact_check
      modelRefs:
        - model: qwen3
          use_reasoning: true
          reasoning_effort: medium
        - model: qwen3-coder-flash
          use_reasoning: true
          reasoning_effort: high
      algorithm:
        type: ratings
        ratings:
          max_concurrent: 3
          on_error: skip
      plugins:
        - type: router_replay
          configuration:
            enabled: true
            max_records: 10000
            capture_request_body: true
            capture_response_body: true
            max_body_bytes: 4096
            # 0 = no truncation (the documented default). Set to a positive
            # byte cap to independently limit structured tool-trace fields
            # (prompt, tool_definitions, and each tool-call's arguments/output)
            # without having to shrink max_body_bytes.
            max_tool_trace_bytes: 0
    - name: computer-science-remom-route
      description: ReMoM route for complex computer science prompts.
      priority: 170
      rules:
        operator: AND
        conditions:
          - type: domain
            name: computer_science
          - type: complexity
            name: needs_reasoning
      modelRefs:
        - model: qwen3
          use_reasoning: true
          reasoning_effort: medium
          weight: 0.3
        - model: qwen3-coder-flash
          use_reasoning: true
          reasoning_description: Use the strongest text model for synthesis.
          reasoning_effort: high
          # No such LoRA
          # lora_name: computer-science-expert
          weight: 0.7
        # - model: llava-omni
        #   use_reasoning: true
        #   reasoning_effort: high
        #   weight: 0.3
      algorithm:
        type: remom
        remom:
          breadth_schedule:
            - 3
            - 2
            - 1
          model_distribution: round_robin
          temperature: 0.7
          include_reasoning: true
          compaction_strategy: summarize
          compaction_tokens: 512
          synthesis_template: Fuse the strongest technical findings into a final answer.
          max_concurrent: 3
          on_error: skip
          shuffle_seed: 7
          include_intermediate_responses: true
          max_responses_per_round: 2
      plugins:
        - type: memory
          configuration:
            enabled: true
            retrieval_limit: 6
            similarity_threshold: 0.72
            auto_store: true
            hybrid_search: true
            hybrid_mode: rerank
            reflection:
              enabled: true
              algorithm: recency_semantic
              max_inject_tokens: 384
              recency_decay_days: 14
              dedup_threshold: 0.9
              block_patterns:
                - api key
                - password
    - name: terse_elo_route
      description: Personalized terse-answer route using Elo selection.
      priority: 160
      rules:
        operator: AND
        conditions:
          - type: preference
            name: terse_answers
      modelRefs:
        - model: qwen3
          use_reasoning: false
        - model: qwen3-coder-flash
          use_reasoning: false
      algorithm:
        type: elo
        elo:
          initial_rating: 1200
          k_factor: 32
          category_weighted: true
          decay_factor: 0.97
          min_comparisons: 10
          cost_scaling_factor: 0.15
          storage_path: state/elo-selection.json
          auto_save_interval: 5m
      plugins:
        - type: fast_response
          configuration:
            message: >-
              The primary model is saturated, so a lightweight response was
              returned immediately.
        - type: request_params
          configuration:
            blocked_params:
              - logprobs
              - top_logprobs
            max_tokens_limit: 8192
            max_n: 4
            strip_unknown: false
    - name: support_router_dc_route
      description: >-
        Embedding-driven support route that escalates only when the derived
        projection band says the request is not a simple support query.
      priority: 150
      rules:
        operator: AND
        conditions:
          - type: embedding
            name: technical_support
          - type: projection
            name: support_escalated
      modelRefs:
        - model: qwen3
          use_reasoning: false
        - model: qwen3-coder-flash
          use_reasoning: true
      algorithm:
        type: router_dc
        router_dc:
          temperature: 0.2
          dimension_size: 384
          min_similarity: 0.7
          use_query_contrastive: true
          use_model_contrastive: true
          require_descriptions: true
          use_capabilities: true
      plugins:
        - type: header_mutation
          configuration:
            add:
              - name: X-Tenant-Tier
                value: premium
            update:
              - name: X-Route-Source
                value: semantic-router
            delete:
              - X-Debug-Trace
    - name: urgent_automix_route
      description: Cost-aware urgent handling with AutoMix.
      priority: 145
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: urgent_keywords
      modelRefs:
        - model: qwen3
          use_reasoning: false
        - model: qwen3-coder-flash
          use_reasoning: true
      algorithm:
        type: automix
        automix:
          verification_threshold: 0.78
          max_escalations: 2
          cost_aware_routing: true
          cost_quality_tradeoff: 0.35
          discount_factor: 0.9
          use_logprob_verification: true
      plugins:
        - type: response_jailbreak
          configuration:
            enabled: true
            threshold: 0.85
            action: annotate
    - name: safe_hybrid_route
      description: 'Composite route combining AND, OR, and NOT with Hybrid selection.'
      priority: 140
      rules:
        operator: AND
        conditions:
          - type: domain
            name: business
          - operator: OR
            conditions:
              - type: keyword
                name: urgent_keywords
              - type: complexity
                name: needs_reasoning
          - operator: NOT
            conditions:
              - type: jailbreak
                name: prompt_injection
      modelRefs:
        - model: qwen3
          use_reasoning: true
        - model: qwen3-coder-flash
          use_reasoning: true
      algorithm:
        type: hybrid
        hybrid:
          elo_weight: 0.4
          router_dc_weight: 0.4
          automix_weight: 0.2
          cost_weight: 0.1
          quality_gap_threshold: 0.08
          normalize_scores: true
    - name: spanish_rl_route
      description: RL-driven route for Spanish-language traffic with Milvus RAG.
      priority: 135
      rules:
        operator: AND
        conditions:
          - type: language
            name: es
      modelRefs:
        - model: qwen3
          use_reasoning: false
        - model: qwen3-coder-flash
          use_reasoning: true
      algorithm:
        type: rl_driven
        rl_driven:
          exploration_rate: 0.15
          use_thompson_sampling: true
          enable_personalization: true
          personalization_blend: 0.4
          cost_awareness: true
          cost_weight: 0.2
          use_router_r1_rewards: true
          enable_llm_routing: true
          router_r1_server_url: 'http://vllm-sr-router-container:8080'
      plugins:
        - type: rag
          configuration:
            enabled: true
            # rag plugin use semantic_cache
            backend: milvus
            similarity_threshold: 0.78
            top_k: 5
            max_context_length: 12000
            injection_mode: tool_role
            on_failure: warn
            cache_results: true
            cache_ttl_seconds: 600
            min_confidence_threshold: 0.55
            backend_config:
              collection: agentic_memory
              reuse_cache_connection: true
              content_field: content
              metadata_field: metadata
              # filter_expression: locale == "es"
              # validOperatorPattern: Operators must be in lower case
              filter_expression: source is not null
    # authz is not ready yet
    # - name: admin_gmtrouter_route
    #   description: Admin route with personalized GMTRouter selection and external API RAG.
    #   priority: 130
    #   rules:
    #     operator: AND
    #     conditions:
    #       - type: authz
    #         name: admin
    #   modelRefs:
    #     - model: qwen3-coder-flash
    #       use_reasoning: true
    #   algorithm:
    #     type: gmtrouter
    #     gmtrouter:
    #       enable_personalization: true
    #       history_sample_size: 50
    #       min_interactions_for_personalization: 5
    #       max_interactions_per_user: 200
    #       # We don't have the pretrained gmtrouter
    #       # model_path: models/gmtrouter.pt
    #       # storage_path: state/gmtrouter.db
    #       storage_path: state/gmt_graph.json
    #   plugins:
    #     - type: rag
    #       configuration:
    #         enabled: true
    #         # rag plugin use semantic_cache
    #         backend: milvus
    #         similarity_threshold: 0.78
    #         top_k: 5
    #         max_context_length: 12000
    #         injection_mode: tool_role
    #         on_failure: warn
    #         cache_results: true
    #         cache_ttl_seconds: 600
    #         min_confidence_threshold: 0.55
    #         backend_config:
    #           # collection: docs
    #           collection: agentic_memory
    #           reuse_cache_connection: true
    #           content_field: content
    #           metadata_field: metadata
    #           # filter_expression: locale == "es"
    #           # validOperatorPattern: Operators must be in lower case
    #           filter_expression: "source is not null"

    - name: long_context_latency_route
      description: Long-context route with latency-aware policy and MCP-backed RAG.
      priority: 125
      rules:
        operator: AND
        conditions:
          - type: context
            name: long_context
      modelRefs:
        - model: qwen3-coder-flash
          use_reasoning: true
      algorithm:
        type: latency_aware
        latency_aware:
          tpot_percentile: 90
          ttft_percentile: 95
          description: Balance throughput and first-token latency for long prompts.
      plugins:
        - type: rag
          configuration:
            enabled: true
            # rag plugin use semantic_cache
            backend: milvus
            similarity_threshold: 0.78
            top_k: 5
            max_context_length: 12000
            injection_mode: tool_role
            on_failure: warn
            cache_results: true
            cache_ttl_seconds: 600
            min_confidence_threshold: 0.55
            backend_config:
              # collection: docs
              collection: agentic_memory
              reuse_cache_connection: true
              content_field: content
              metadata_field: metadata
              # filter_expression: locale == "es"
              # validOperatorPattern: Operators must be in lower case
              filter_expression: source is not null

    - name: fallback_knn_route
      description: KNN fallback route for general traffic with OpenAI vector-store RAG.
      priority: 120
      rules:
        operator: AND
        conditions:
          - type: domain
            name: other
      modelRefs:
        - model: qwen3
          use_reasoning: false
      algorithm:
        type: knn
      plugins:
        - type: rag
          configuration:
            enabled: true
            # rag plugin use semantic_cache
            backend: milvus
            similarity_threshold: 0.78
            top_k: 5
            max_context_length: 12000
            injection_mode: tool_role
            on_failure: warn
            cache_results: true
            cache_ttl_seconds: 600
            min_confidence_threshold: 0.55
            backend_config:
              # collection: docs
              collection: agentic_memory
              reuse_cache_connection: true
              content_field: content
              metadata_field: metadata
              # filter_expression: locale == "es"
              # validOperatorPattern: Operators must be in lower case
              filter_expression: source is not null
    - name: clarification_kmeans_route
      description: KMeans route for clarification requests with local vector-store RAG.
      priority: 115
      rules:
        operator: AND
        conditions:
          - type: user_feedback
            name: need_clarification
      modelRefs:
        - model: qwen3
          use_reasoning: false
        - model: qwen3-coder-flash
          use_reasoning: true
      algorithm:
        type: kmeans
      plugins:
        - type: rag
          configuration:
            enabled: true
            # rag plugin use semantic_cache
            backend: milvus
            similarity_threshold: 0.78
            top_k: 5
            max_context_length: 12000
            injection_mode: tool_role
            on_failure: warn
            cache_results: true
            cache_ttl_seconds: 600
            min_confidence_threshold: 0.55
            backend_config:
              # collection: docs
              collection: agentic_memory
              reuse_cache_connection: true
              content_field: content
              # filter_expression: locale == "es"
              # validOperatorPattern: Operators must be in lower case
              filter_expression: "source is not null"

    - name: repeat_question_escalation
      description: >-
        Escalate when the user repeats the same question after an unsatisfying
        answer.
      priority: 114
      rules:
        operator: AND
        conditions:
          - type: reask
            name: likely_dissatisfied
      modelRefs:
        - model: qwen3-coder-flash
          use_reasoning: true
      algorithm:
        type: static
      plugins:
        - type: header_mutation
          configuration:
            add:
              - key: x-escalation-reason
                value: repeated-question
    - name: safe_only_svm_route
      description: SVM route that only matches when prompt-injection signals are absent.
      priority: 110
      rules:
        operator: NOT
        conditions:
          - type: jailbreak
            name: prompt_injection
      modelRefs:
        - model: qwen3
          use_reasoning: false
      algorithm:
        type: svm
      plugins:
        - type: rag
          configuration:
            enabled: true
            backend: milvus
            similarity_threshold: 0.78
            top_k: 5
            max_context_length: 12000
            injection_mode: tool_role
            on_failure: warn
            cache_results: true
            cache_ttl_seconds: 600
            min_confidence_threshold: 0.55
            backend_config:
              # collection: docs
              collection: agentic_memory
              reuse_cache_connection: true
              content_field: content
              # filter_expression: locale == "es"
              # validOperatorPattern: Operators must be in lower case
              filter_expression: "source is not null"

    - name: mlp_experimental_route
      description: Experimental MLP-based model selection route.
      priority: 103
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: machine_learning
      modelRefs:
        - model: qwen3
          use_reasoning: false
      algorithm:
        type: mlp

    # We don't have SDXL or image generation service
    # - name: image_generation_route
    #   description: Dedicated image-generation route using the OpenAI image backend.
    #   priority: 105
    #   rules:
    #     operator: AND
